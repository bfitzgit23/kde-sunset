masters = gentoo

# Generate the modern md5-dict metadata cache in metadata/md5-cache.
# This is what lets eix / emerge / egencache read this repository without
# sourcing every ebuild (and it is where portage reports ebuilds whose
# metadata phase fails).
cache-formats = md5-dict

# Council decisions: EAPIs 0-6 banned, EAPI 7 deprecated (2025-07-13).
# Every ebuild in this overlay is EAPI 8.
eapis-banned = 0 1 2 3 4 5 6
eapis-deprecated = 7

# Thin Manifests (DIST entries only), unsigned, like the main tree.
thin-manifests = true
sign-manifests = false

update-changelog = false
